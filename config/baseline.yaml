project: AutoTune-AI
model:
  name: meta-llama/Llama-3.2-1B-Instruct
  max_length: 256
data:
  train_file: sample_data/train.jsonl
  validation_file: sample_data/validation.jsonl
train:
  learning_rate: 0.0001
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  eval_steps: 20
  weight_decay: 0.01
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
monitor:
  min_evaluations: 4
  patience: 2
  min_delta: 0.01
  generalization_gap: 0.2
  underfit_loss_floor: 1.3
  flat_window: 4
  flat_threshold: 0.04
  loss_spike_ratio: 2.0
  loss_spike_patience: 2
  grad_norm_warning: 1000.0
safety:
  max_trials: 3
meta_agent:
  enabled: false
  model: muse-spark-1.3
simulator:
  scenario: overfit
